<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安心家办 - 家庭健康 AI 办事助手</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-shell">
      <section class="app-screen" aria-label="安心家办应用原型">
        <header class="topbar">
          <button class="profile-chip" id="profileButton" aria-label="切换家庭成员">
            <span>妈</span>
          </button>
          <div class="brand-block">
            <p class="eyebrow">周六 16:30 · 家庭健康办事台</p>
            <h1>安心家办</h1>
          </div>
          <button class="round-button alert" id="sosButton" aria-label="紧急通知子女">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.2 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z" />
            </svg>
          </button>
        </header>

        <section class="mode-switch" aria-label="视角切换">
          <button class="mode active" data-role="elder">老人端</button>
          <button class="mode" data-role="child">子女端</button>
        </section>

        <section class="hero-grid">
          <article class="today-card">
            <div class="today-number">
              <strong id="todoCount">4</strong><span>件</span>
            </div>
            <p>今天待办</p>
            <div class="bar-chart" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </article>

          <article class="voice-card">
            <button class="voice-button" id="voiceButton" aria-label="语音输入">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Z" />
                <path d="M19 11a7 7 0 0 1-14 0" />
                <path d="M12 18v4" />
              </svg>
            </button>
            <div>
              <p class="eyebrow">按住说事</p>
              <strong id="voiceText">帮我看看这张化验单</strong>
            </div>
          </article>
        </section>

        <section class="snapshot-row" aria-label="健康概览">
          <article class="mini-card">
            <span class="mini-icon blue">压</span>
            <div><strong>128/82</strong><p>血压正常</p></div>
          </article>
          <article class="mini-card">
            <span class="mini-icon mint">药</span>
            <div><strong id="medSummary">1/2</strong><p>今日已确认</p></div>
          </article>
          <article class="mini-card">
            <span class="mini-icon coral">险</span>
            <div><strong>92</strong><p>短信高危</p></div>
          </article>
        </section>

        <section class="quick-grid" aria-label="核心功能">
          <button class="quick-card active" data-view="home">
            <span class="quick-icon violet">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3Z" /></svg>
            </span>
            <span>待办</span>
          </button>
          <button class="quick-card" data-view="visit">
            <span class="quick-icon coral">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.1 7-11a7 7 0 1 0-14 0c0 5.9 7 11 7 11Z" /><path d="M12 8v5" /><path d="M9.5 10.5h5" /></svg>
            </span>
            <span>就医</span>
          </button>
          <button class="quick-card" data-view="report">
            <span class="quick-icon blue">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z" /><path d="M14 2v5h5" /><path d="M9 13h6" /><path d="M9 17h4" /></svg>
            </span>
            <span>读报告</span>
          </button>
          <button class="quick-card" data-view="medicine">
            <span class="quick-icon mint">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 20.5 10-10a5 5 0 0 0-7-7l-10 10a5 5 0 0 0 7 7Z" /><path d="m8.5 8.5 7 7" /></svg>
            </span>
            <span>用药</span>
          </button>
          <button class="quick-card" data-view="claim">
            <span class="quick-icon amber">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18l-4-2-4 2-4-2-4 2Z" /><path d="M8 7h8" /><path d="M8 11h8" /><path d="M8 15h5" /></svg>
            </span>
            <span>报销</span>
          </button>
          <button class="quick-card" data-view="fraud">
            <span class="quick-icon coral">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /><path d="M12 8v5" /><path d="M12 16h.01" /></svg>
            </span>
            <span>防诈骗</span>
          </button>
        </section>

        <section class="content-stage" id="stage" aria-live="polite"></section>

        <nav class="tabbar" aria-label="底部导航">
          <button class="tab active" data-view="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3Z" /></svg>
            <span>首页</span>
          </button>
          <button class="tab" data-view="report">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" /><path d="M13 3v5h5" /></svg>
            <span>报告</span>
          </button>
          <button class="tab" data-view="medicine">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 21 12-12a5 5 0 0 0-7-7L2 14a5 5 0 0 0 7 7Z" /></svg>
            <span>用药</span>
          </button>
          <button class="tab" data-view="family">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" /><path d="M22 21v-2a4 4 0 0 0-3-3.8" /></svg>
            <span>家庭</span>
          </button>
          <button class="tab" data-view="profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0" /><path d="M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
            <span>我的</span>
          </button>
        </nav>

        <div class="sheet" id="sheet" aria-hidden="true">
          <div class="sheet-card">
            <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
            <div id="sheetContent"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
